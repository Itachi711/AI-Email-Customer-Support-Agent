[project]
name = "langgraph-email-automation"
version = "0.1.0"
description = "M1 StateGraph email support baseline"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["work", "db", "db_openai_m1"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
